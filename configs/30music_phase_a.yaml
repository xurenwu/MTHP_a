seed: 2026
device: cuda
output_dir: outputs/reproduction

data:
  train_file: data_mthp_hgcn/data_lastfm/tr-user-item-time-top30000-min100-max1000-hour.lst
  valid_file: null
  test_file: data_mthp_hgcn/data_lastfm/te-user-old-item-time-top30000-min100-max1000-hour.lst
  test_new_file: data_mthp_hgcn/data_lastfm/te-user-new-item-time-top30000-min100-max1000-hour.lst
  timestamp_unit: hour
  max_history: 3
  validation_items_per_user: 0
  min_train_history: 0
  item_id_mode: auto

graph:
  matrix_file: data_mthp_hgcn/data_lastfm/item_matrix.npy
  degree_file: null
  matrix_is_normalized: false
  self_loop_mode: auto
  degree_source: local
  build_if_missing: false
  rebuild_from_train: false
  strict_no_leakage: false
  cache_size: 20000

model:
  embedding_dim: 256
  shcn_layers: 1
  shcn_heads: 1
  shcn_dropout: 0.1
  graph_mix_coeff: 0.1
  shcn_residual: false
  shcn_output_projection: false
  user_fusion: structural_only
  similarity: cosine
  granularities: [hour, day, week]
  granularity_weights: learnable_global
  decay_mode: shared_user
  decay_init: 1.0
  decay_parameterization: clamp
  positive_intensity: false

train:
  epochs: 200
  batch_size: 512
  eval_batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.01
  negative_samples: 5
  negative_power: 0.75
  exclude_seen_negatives: false
  num_workers: 0
  patience: 0
  monitor: recall@20
  checkpoint_policy: last
  gradient_clip: 0.0
  amp: false

evaluation:
  ks: [10, 20, 30]
  full_ranking: true
  item_chunk_size: 2048
  mask_seen_items: false
  evaluate_new_items: true
